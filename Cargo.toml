[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/connector-gen3",
    "crates/emu",
    "crates/mcp",
    "crates/agent-bridge",
    "crates/app",
    "crates/mgba-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
repository = "https://github.com/Zannael/tauros"
license = "MIT"

[workspace.dependencies]
tauros-model = { path = "crates/model" }
tauros-connector-gen3 = { path = "crates/connector-gen3" }
tauros-emu = { path = "crates/emu" }
tauros-mcp = { path = "crates/mcp" }
tauros-agent-bridge = { path = "crates/agent-bridge" }
tauros-mgba-sys = { path = "crates/mgba-sys" }

# Dependencies (hashing, bindgen) are optimised even in debug builds; the workspace's
# own crates stay unoptimised for debugging.
[profile.dev.package."*"]
opt-level = 2

# The emulator loop must hold 59.7 fps in debug builds too (EMU-004).
[profile.dev.package.tauros-emu]
opt-level = 2

[profile.dev.package.tauros-app]
opt-level = 2
