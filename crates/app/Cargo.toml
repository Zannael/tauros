[package]
name = "tauros-app"
default-run = "tauros-app"
description = "Layer 1: the Tauros desktop app (Tauri shell; ROM playback and chosen-map boot with video, input and audio)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauros-model.workspace = true
tauros-connector-gen3.workspace = true
tauros-emu.workspace = true
tauros-mcp.workspace = true
tauros-agent-bridge.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }

[features]
# Serve ui/ from the binary even in debug builds (there is no dev server).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The same gtk-rs version Tauri uses: keyboard input is read on the GTK window
# itself, before WebKit and the input method see it.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
