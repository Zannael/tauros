[package]
name = "tauros-app"
description = "Layer 1: the Tauros desktop app (Tauri shell; EMU-004 runs a ROM with video, input and audio)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauros-model.workspace = true
tauros-connector-gen3.workspace = true
tauros-emu.workspace = true
tauros-mcp.workspace = true
tauros-agent-bridge.workspace = true
tauri = { version = "2", features = [] }

[features]
# Serve ui/ from the binary even in debug builds (there is no dev server).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The same gtk-rs version Tauri uses: keyboard input is read on the GTK window
# itself, before WebKit and the input method see it.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
