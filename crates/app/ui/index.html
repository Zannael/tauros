<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tauros</title>
  <style>
    :root { --bg: #18141a; --fg: #ece6ee; --muted: #9a90a0; --accent: #f0aa28; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif;
           display: flex; gap: 14px; justify-content: center; align-items: flex-start; padding: 12px;
           height: 100vh; }
    main { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 720px; min-width: 0;
           max-height: 100%; overflow-y: auto; }
    @media (max-width: 1000px) { body { flex-direction: column; align-items: center; height: auto; }
                                 main, #chat { width: 100%; } #chat { height: 520px; } }
    header { display: flex; gap: 12px; align-items: center; width: 720px; max-width: 100%; }
    header strong { color: var(--accent); }
    #status { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button { background: #2c2530; color: var(--fg); border: 1px solid #44394a; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    canvas:focus { outline: none; }
    canvas { width: 720px; max-width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; background: #000; border-radius: 4px; }
    #help { color: var(--muted); font-size: 12px; }
    kbd { background: #2c2530; border-radius: 3px; padding: 0 4px; }
    #history-panel { width: 720px; max-width: 100%; background: #211c24; border: 1px solid #352c3b; border-radius: 6px; padding: 10px; display: none; }
    #history-panel.open { display: block; }
    #history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    #history-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
    .history-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #18141a; border-radius: 4px; font-size: 12px; }
    .history-origin { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #2c2530; color: var(--accent); white-space: nowrap; }
    .history-summary { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-sha { color: var(--muted); font-family: monospace; }
    #chat { width: 400px; height: 100%; display: flex; flex-direction: column; background: #211c24;
            border: 1px solid #352c3b; border-radius: 6px; min-height: 0; }
    #chat-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #352c3b; }
    #chat-header strong { flex: 1; }
    #chat-scope { color: var(--muted); font-size: 11px; padding: 0 10px 6px; border-bottom: 1px solid #352c3b;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #chat-log { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .msg { padding: 7px 9px; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
    .msg.user { background: #3a2f1a; align-self: flex-end; max-width: 90%; }
    .msg.agent { background: #18141a; }
    .msg.agent.streaming::after { content: '▍'; color: var(--accent); }
    .msg.error { background: #3a1a1f; color: #ffb3bd; }
    .msg.meta { color: var(--muted); font-size: 11px; padding: 0 2px; background: none; }
    .tool { background: #18141a; border: 1px solid #352c3b; border-radius: 6px; font-size: 12px; }
    .tool summary { padding: 5px 8px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
    .tool .tool-name { font-family: monospace; color: var(--accent); flex: 1; }
    .tool .tool-state { font-size: 11px; color: var(--muted); }
    .tool.ok .tool-state { color: #8fd18f; }
    .tool.failed .tool-state { color: #ff8f9c; }
    .tool pre { margin: 0; padding: 6px 8px; border-top: 1px solid #352c3b; max-height: 180px; overflow: auto;
                white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; color: var(--muted); }
    #chat-form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #352c3b; }
    #chat-input { flex: 1; resize: none; height: 54px; background: #18141a; color: var(--fg); border: 1px solid #44394a;
                  border-radius: 6px; padding: 6px; font: inherit; }
    #chat-input:focus { outline: 1px solid var(--accent); }
    #chat-form button { align-self: stretch; }
    button:disabled { opacity: .5; cursor: default; }
    .select-control { position: relative; min-width: 0; }
    .select-control::after { content: ''; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px;
                            border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
                            transform: translateY(-70%) rotate(45deg); pointer-events: none; }
    select { -webkit-appearance: none; appearance: none; }
    #play-bar { display: none; gap: 6px; align-items: center; width: 100%; font-size: 12px; color: var(--muted); }
    #play-bar.open { display: flex; }
    #play-bar .select-control { flex: 1; }
    #play-bar select { width: 100%; padding-right: 30px; height: 30px; }
    #play-bar select, #play-bar input { background: #18141a; color: var(--fg); border: 1px solid #44394a; border-radius: 6px;
                                        padding: 4px 6px; font: inherit; }
    #play-map { flex: 1; min-width: 0; }
    #play-bar input { width: 56px; }
    #play-status { width: 100%; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere;
                   max-height: 90px; overflow-y: auto; }
    #play-status.error { color: #ff8f9c; }
  </style>
</head>
<body>
  <main>
  <header>
    <strong>Tauros</strong>
    <span id="status">Open a ROM to start.</span>
    <input id="file" type="file" accept=".gba" hidden>
    <button id="toggle-history">History</button>
    <button id="open">Open ROM…</button>
  </header>
  <div id="play-bar" aria-label="Build and play">
    <div class="select-control"><select id="play-map" aria-label="Map"></select></div>
    x <input id="play-x" type="number" min="0" max="255" aria-label="X">
    y <input id="play-y" type="number" min="0" max="255" aria-label="Y">
    <button id="play-preview" title="Start a fresh preview from the last built ROM without rebuilding">Preview</button>
    <button id="play-build" title="Build the project and boot it at this map and position">Build &amp; play</button>
  </div>
  <div id="play-status" role="status"></div>
  <canvas id="screen" width="240" height="160"></canvas>
  <div id="help">
    <kbd>←↑→↓</kbd> D-pad · <kbd>X</kbd> A · <kbd>Z</kbd> B · <kbd>Enter</kbd> Start ·
    <kbd>Backspace</kbd> Select · <kbd>A</kbd> L · <kbd>S</kbd> R · click the game to enable sound
  </div>
  <section id="history-panel" aria-label="Change history">
    <div id="history-header">
      <strong>Change history</strong>
      <button id="refresh-history">Refresh</button>
    </div>
    <ul id="history-list"></ul>
  </section>
  </main>
  <aside id="chat" aria-label="Agent chat">
    <div id="chat-header">
      <strong>Agent</strong>
      <button id="chat-new" title="Start a new conversation">New chat</button>
    </div>
    <div id="chat-scope"></div>
    <div id="chat-log" aria-live="polite"></div>
    <form id="chat-form">
      <textarea id="chat-input" placeholder="Ask the agent… (Enter sends, Shift+Enter new line)"></textarea>
      <button id="chat-send" type="submit">Send</button>
      <button id="chat-stop" type="button" hidden>Stop</button>
    </form>
  </aside>
  <script src="main.js"></script>
</body>
</html>
