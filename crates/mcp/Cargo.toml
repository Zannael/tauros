[package]
name = "tauros-mcp"
description = "Layer 2: domain MCP server over the semantic model and emulator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
tauros-model.workspace = true
tauros-emu.workspace = true
base64 = "0.23"
png = "0.18"
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
